factory_modules: []

search:
  provider: wikipedia
  language: ru
  max_results: 5
  max_related_articles: 6
  timeout_seconds: 20

fact_extractor:
  provider: tooken
  model_id: gpt-5.6-sol
  max_context_characters: 120000
  max_source_characters: 12000
  max_output_tokens: 5000

prompt_builder:
  provider: tooken
  model_id: gpt-5.6-sol
  max_output_tokens: 1500

visual_validator:
  provider: kaggle
  kernel_slug: historical-panorama-visual-validator
  model_id: Qwen/Qwen2.5-VL-3B-Instruct
  accelerator: NvidiaTeslaT4
  max_input_size: 384
  max_new_tokens: 1600

image_generator:
  provider: tooken
  model_id: gpt-image-2
  size: 1536x1024
  quality: high
  output_width: 2048
  output_height: 1024
  seed: 42

openai_compatible:
  base_url: https://tooken.club/v1
  token_env: GPT_TOKEN
  timeout_seconds: 300

kaggle:
  poll_interval_seconds: 15
  timeout_seconds: 1800
  work_dir: .kaggle-work
  force_ipv4: true

output_dir: runs

pipeline:
  max_full_generations: 3
  perspective_frame_size: 512
  # Local checks for file readability, configured dimensions and exact 2:1 ratio.
  technical_validation_enabled: true
  # 0 disables multimodal validation; 1-5 runs independent checks per image attempt.
  visual_validation_runs: 1
