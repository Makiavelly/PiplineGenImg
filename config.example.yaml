factory_modules: []

search:
  provider: wikipedia
  language: ru
  max_results: 5
  max_related_articles: 6
  timeout_seconds: 20

fact_extractor:
  provider: kaggle
  kernel_slug: historical-panorama-fact-extractor
  model_id: Qwen/Qwen2.5-3B-Instruct
  accelerator: NvidiaTeslaT4

prompt_builder:
  provider: kaggle
  kernel_slug: historical-panorama-prompt-builder
  model_id: Qwen/Qwen2.5-3B-Instruct
  accelerator: NvidiaTeslaT4

visual_validator:
  provider: kaggle
  kernel_slug: historical-panorama-visual-validator
  model_id: Qwen/Qwen2.5-VL-3B-Instruct
  accelerator: NvidiaTeslaT4
  max_input_size: 384
  max_new_tokens: 1600

image_generator:
  provider: kaggle
  kernel_slug: historical-panorama-sdxl-generator
  model_id: stabilityai/stable-diffusion-xl-base-1.0
  accelerator: NvidiaTeslaT4
  width: 1536
  height: 768
  output_width: 2048
  output_height: 1024
  steps: 30
  guidance_scale: 7.0
  seed: 42

kaggle:
  poll_interval_seconds: 15
  timeout_seconds: 1800
  work_dir: .kaggle-work

output_dir: runs

pipeline:
  max_full_generations: 3
  perspective_frame_size: 512
